name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Backend (tipos y tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nex
          POSTGRES_PASSWORD: nex
          POSTGRES_DB: nex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nex" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://nex:nex@localhost:5432/nex_test

  ios-core:
    name: NEXCore (tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: ios/NEXCore

  ios-app:
    name: App iOS (compilación para simulador)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Compilar
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project NEX.xcodeproj -scheme NEX \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | tee build.log | grep -E "error|warning: unre|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Errores de compilación
        if: failure()
        working-directory: ios
        run: grep -E "error:" build.log | sort -u | head -100

  ios-e2e:
    name: App iOS (prueba de extremo a extremo en simulador)
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      DATABASE_URL: postgres://nex:nex@localhost:5432/nex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PostgreSQL
        run: |
          brew list postgresql@14 >/dev/null 2>&1 || brew install postgresql@14
          echo "$(brew --prefix postgresql@14)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix postgresql@14)/bin:$PATH"
          brew services start postgresql@14
          for i in $(seq 1 30); do pg_isready -q && break; sleep 1; done
          psql postgres -c "CREATE USER nex WITH PASSWORD 'nex' SUPERUSER" -c "CREATE DATABASE nex OWNER nex"
      - name: Backend
        working-directory: backend
        run: |
          npm ci
          npm run build
          JWT_SECRET=secreto-solo-para-ci-de-mas-de-32-caracteres AUTH_RATE_LIMIT_PER_MINUTE=1000 \
            nohup node dist/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8080/health && break; sleep 1; done
      - name: Sembrar avisos de prueba
        run: .github/scripts/seed-demo.sh
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Prueba de interfaz
        working-directory: ios
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available | grep -E "iPhone 1[5-9]( Pro)? \(" | head -1 | grep -oE "[0-9A-F-]{36}")
          echo "Simulador: $UDID"
          xcrun simctl boot "$UDID" || true
          # Cuando la prueba lo pide, conduce el simulador de Sol al Bernabéu a 30 m/s.
          ( for i in $(seq 1 1200); do [ -f /tmp/nex-shots/.drive ] && break; sleep 1; done
            [ -f /tmp/nex-shots/.drive ] && xcrun simctl location "$UDID" start --speed=30 40.4168,-3.7038 \
              40.4190,-3.6975 40.4193,-3.6931 40.4250,-3.6900 40.4335,-3.6880 40.4460,-3.6915 40.4525,-3.6905
          ) > /dev/null 2>&1 &
          xcodebuild test -project NEX.xcodeproj -scheme NEX -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "error|Test Case|XCTAssert|No aparece|failed|TEST|\*\*" || true
          ls -la /tmp/nex-shots || true
          grep -q "TEST SUCCEEDED" test.log
      - name: Diagnóstico
        if: always()
        run: |
          tail -40 backend/server.log || true
          grep -E "error:|failed" ios/test.log | sort -u | head -60 || true
      - name: Reducir capturas
        if: always()
        run: |
          mkdir -p shots
          for f in /tmp/nex-shots/*.png; do
            [ -f "$f" ] || continue
            sips -s format jpeg -s formatOptions 70 -Z 1100 "$f" --out "shots/$(basename "${f%.png}").jpg" >/dev/null
          done
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: shots
      - name: Publicar capturas en docs/capturas
        if: always() && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/claude/')
        run: |
          ls shots/*.jpg >/dev/null 2>&1 || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          rm -rf docs/capturas && mkdir -p docs/capturas && cp shots/*.jpg docs/capturas/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/capturas
          git diff --cached --quiet || git commit -m "Actualizar capturas de la prueba de interfaz [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
