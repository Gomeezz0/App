# Proyecto Xcode de NEX. Generar con:  brew install xcodegen && xcodegen generate
name: NEX
options:
  bundleIdPrefix: app.nex
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # La app está en español: así MapKit devuelve las indicaciones en español en cualquier iPhone.
  developmentLanguage: es
packages:
  NEXCore:
    path: NEXCore
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    # Identificador base. Debe ser único en Apple: cámbialo por uno tuyo (p. ej. com.tunombre.nex).
    NEX_BUNDLE_ID: app.nex.ios
    CURRENT_PROJECT_VERSION: "1"
targets:
  NEX:
    type: application
    platform: iOS
    sources:
      - NEX
      - Shared
    dependencies:
      - package: NEXCore
      - target: NEXWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NEX_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # URL del backend. En desarrollo, el servidor local (ver backend/README).
        NEX_API_BASE_URL: "http://localhost:8080"
    info:
      path: NEX/Resources/Info.plist
      properties:
        CFBundleDisplayName: NEX
        CFBundleDevelopmentRegion: es
        CFBundleLocalizations:
          - es
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - audio
        NSLocationWhenInUseUsageDescription: NEX usa tu ubicación para mostrarte en el mapa, guiarte hasta tu destino y avisarte de incidencias cercanas.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        NEXAPIBaseURL: $(NEX_API_BASE_URL)
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: app.nex.ios
            CFBundleURLSchemes:
              - nex
  NEXWidgets:
    type: app-extension
    platform: iOS
    sources:
      - NEXWidgets
      - Shared
    dependencies:
      - package: NEXCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NEX_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: NEXWidgets/Info.plist
      properties:
        CFBundleDisplayName: NEX
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  NEXUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - NEXUITests
    dependencies:
      - target: NEX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(NEX_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: NEX
schemes:
  NEX:
    build:
      targets:
        NEX: all
        NEXUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NEXUITests
